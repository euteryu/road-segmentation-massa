# configs/_base.yaml
# Shared defaults. Every other config in this folder is layered on top of this,
# so a change that should apply everywhere is a one-line edit here.

# Confirmed Kaggle mount path. If it ever changes, src/data/splits.py falls back
# to searching /kaggle/input for a directory holding both *_sat.jpg and *_mask.png.
data_root: /kaggle/input/datasets/balraj98/deepglobe-road-extraction-dataset/train
seed: 42

# --- data ---------------------------------------------------------------
# val_size is held out FIRST and is identical for every run, so runs with
# different train_size remain directly comparable. train_size is the number of
# TRAINING images (it used to be the total, including val - not the same thing).
val_size: 200
train_size: 400
crop_size: 256
batch_size: 16
num_workers: 2

# --- optimisation -------------------------------------------------------
epochs: 6
lr: 0.0003
weight_decay: 0.0001
amp: true          # mixed precision; ~2x faster on a T4, no accuracy cost here

# --- loss ---------------------------------------------------------------
# Dice-heavy (bce_weight < 0.5): roads are ~5-10% of pixels, so plain BCE lets
# the model score well by predicting background. See src/losses.py.
bce_weight: 0.3

# --- evaluation ---------------------------------------------------------
# Error on this task is dominated by boundary placement on thin structures, not by
# missed roads (see outputs/figures/*/example_median_*.png). TTA attacks that at
# inference cost only - no retraining. E8's paired ablation put the whole E4 gain
# on TTA (+0.0160) and none on overlap 128 (+0.0009 for 1.5x inference time), so
# overlap is back at 64. Do not raise it again without a paired reason.
tile_overlap: 64   # overlap between sliding-window tiles
tta: true          # average over the 8 square symmetries the training aug uses
# Grid-searched at 1024px in E7 (src/sweep_postproc.py). Worth only +0.0028, but
# free - the surface is flat from area 0..1000 and only turns negative at 2000,
# where the floor starts eating genuine road stubs. Do not re-tune this.
close_kernel: 9    # morphological closing kernel (post-processing)
min_area: 500      # drop connected components smaller than this many pixels
